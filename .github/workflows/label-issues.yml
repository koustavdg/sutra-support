name: Label issues by type

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Apply issue type labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const match = body.match(/### Issue type\s*\r?\n\s*\r?\n?([^\r\n]+)/i);

            const labelsByType = {
              'Android Bug': ['android-bug', 'bug'],
              'iOS Bug': ['ios-bug', 'bug'],
              'Feature Ask': ['feature'],
            };

            const selectedType = match?.[1]?.trim();
            const labels = labelsByType[selectedType];

            if (!labels) {
              core.info(`No recognized issue type found for issue #${issue.number}.`);
              return;
            }

            const managedLabels = Object.values(labelsByType).flat();

            for (const label of managedLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'bug' ? 'd73a4a' : label === 'feature' ? 'a2eeef' : '1d76db',
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels,
            });
