name: Submit an issue
description: Report a bug or request a feature for Sutra
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **Sutra**! A few details make issues much
        faster to understand and address.

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type
      description: What kind of issue are you submitting?
      options:
        - Android Bug
        - iOS Bug
        - Feature Ask
      default: 0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened or what would you like to see?
      description: Describe the problem, expected behavior, or feature idea.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce or additional context
      placeholder: |
        1. Go to…
        2. Tap…
        3. See…

  - type: dropdown
    id: library
    attributes:
      label: Which library?
      options:
        - Kavita
        - Calibre / calibre-web
        - Project Gutenberg
        - Other OPDS server
        - Not applicable

  - type: input
    id: version
    attributes:
      label: Sutra version & device
      description: From Settings → About (e.g. "1.0.0 (1)"), plus your device and OS version.
      placeholder: "1.0.0 (1) · Pixel 9, Android 16"
    validations:
      required: true
